let frame, loads = 0;
async function open(url, wait = 1000){
  if (frame) frame.remove();
  frame = document.createElement("iframe");
  loads = 0;
  document.body.appendChild(frame);
  await new Promise(res => { frame.onload = () => { loads++; res(); }; frame.src = url; });
  frame.onload = () => { loads++; harvest(); hook(); observe(); };
  hook(); observe();
  await settle(Math.min(wait, 700));
  return frame.contentWindow;
}
/* Espera a que la página se estabilice: sin llamadas simuladas, accesos al
   almacenamiento ni cambios del DOM durante 500 ms (mínimo "min", máximo 10 s).
   Evita depender de esperas fijas cuando el navegador frena los temporizadores. */
let mutations = 0;
function observe(){
  try { new MutationObserver(m => { mutations += m.length; }).observe(frame.contentDocument, { subtree: true, childList: true, attributes: true, characterData: true }); } catch (e) {}
}
function activity(){
  try { const m = frame.contentWindow.__mock; return (m ? m.calls.length + m.storage.length : 0) + mutations + loads * 100000; } catch (e) { return -1; }
}
async function settle(min = 300, max = 10000){
  const t0 = Date.now();
  await sleep(min);
  let last = activity(), stableSince = Date.now();
  while (Date.now() - t0 < max){
    await sleep(100);
    const n = activity();
    if (n !== last){ last = n; stableSince = Date.now(); }
    else if (Date.now() - stableSince >= 500) break;
  }
}
function hook(){
  const w = frame.contentWindow;
  w.__alerts = []; w.alert = (m) => w.__alerts.push(String(m)); w.confirm = () => true;
}
function harvest(){
  try { const w = frame.contentWindow; if (w.__mock && !w.__harvested){ w.__harvested = true; ALL_STORAGE.push(...w.__mock.storage.map(s => ({ ...s, page: w.location.pathname.split("/").pop() }))); } } catch (e) {}
}

const flickerCase = (name, url, expBefore, expAfter) => add("Mi selección sin parpadeo (CC1)", name, async () => {
  if (frame) frame.remove();
  frame = document.createElement("iframe"); loads = 0;
  document.body.appendChild(frame);
  await new Promise(res => { frame.onload = () => { loads++; res(); }; frame.src = url; });
  hook(); observe();
  const before = linkState();                   // al terminar la carga, con el acceso aún pendiente (lentoacc)
  await sleep(2800); await settle(300);
  const after = linkState();
  return { ok: [].concat(expBefore).includes(before) && after === expAfter && W().__mock.errors.length === 0, got: { before, after } };
});

async function run(){
  localStorage.clear(); sessionStorage.clear();
  localStorage.setItem("mobau_seleccion", COMMON);
  const t = document.getElementById("t"); let ok = 0;
  for (const [i, c] of cases.entries()){
    let r;
    try { r = await c.fn(); } catch (e) { r = { ok: false, got: { exception: String(e && e.stack || e) } }; }
    harvest();
    if (r.ok) ok++;
    t.insertAdjacentHTML("beforeend", `<tr><td>${i + 1}</td><td>${c.group}</td><td>${c.name}</td><td><small>${JSON.stringify(r.got).replace(/</g, "&lt;").slice(0, 900)}</small></td><td class="${r.ok ? "ok" : "ko"}">${r.ok ? "OK" : "FALLO"}</td></tr>`);
  }
  if (frame) frame.remove();
  document.getElementById("sum").textContent = `${ok}/${cases.length} correctos`;
  window.__result = { ok, total: cases.length, failed: cases.map((c, i) => c.name).filter((_, i) => !t.rows[i + 1].lastChild.classList.contains("ok")) };
}
run();
</script>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=acceso.html">
<title>Redirigiendo… — Mobau</title>
<!--
  Página sustituida por acceso.html (Punto 35A). Se conserva el archivo
  para que enlaces y marcadores antiguos sigan funcionando. Del query solo
  se mira "motivo", y únicamente para traducirlo a un valor fijo de esta
  lista (el antiguo "anadir-proyecto" pasa a "proyecto"); nunca se reenvía
  ni se muestra ningún valor recibido. location.replace() evita que esta
  página quede en el historial; el meta refresh (sin motivo) cubre el caso
  sin JavaScript.
-->
<script>
  (function () {
    var MOTIVOS = { "anadir-proyecto": "proyecto", "guardar": "guardar", "proyecto": "proyecto", "cotizacion": "cotizacion" };
    var motivo = new URLSearchParams(location.search).get("motivo");
    var destino = Object.prototype.hasOwnProperty.call(MOTIVOS, motivo)
      ? "acceso.html?motivo=" + MOTIVOS[motivo]
      : "acceso.html";
    location.replace(destino);
  })();
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<main class="wrap" style="padding: 80px 0; text-align:center;">
  <p>Redirigiendo…</p>
  <p><a href="acceso.html" class="btn btn-primary">Ir al acceso</a></p>
</main>

</body>
</html>

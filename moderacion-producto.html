<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ciclo de vida — Moderación — Mobau</title>
<link rel="stylesheet" href="styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="cabecera.css">
<link rel="stylesheet" href="distribuidor.css">
<style>
  /* Consola de moderación: ciclo de vida de un producto (41, D2). */
  .mod-head-meta{ display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; margin-top:10px; font-size:14px; color: var(--ink-soft); }
  .mod-section{ margin-top:36px; }
  .mod-section h2{ font-size:18px; margin:0 0 10px; }
  .mod-box{ margin:16px 0 0; padding:12px 16px; border:1px solid var(--line); border-left:3px solid var(--accent); border-radius: var(--radius); background: var(--surface); font-size:14px; color: var(--ink); overflow-wrap:anywhere; }
  .mod-box p{ margin:0; max-width:none; }
  .mod-box p + p{ margin-top:6px; }
  .mod-box--alert{ border-left-color: var(--danger); }
  .mod-table td, .mod-table th{ overflow-wrap:anywhere; }
  .mod-table td:first-child{ font-weight:600; }
  .mod-history{ margin:0; padding-left:20px; font-size:14px; }
  .mod-history li{ margin-bottom:6px; overflow-wrap:anywhere; }
  .mod-blocks{ margin:0; padding-left:20px; font-size:14px; color: var(--ink); }
  .mod-actions{ display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; }
  .mod-btn-danger{ color: var(--danger); border-color: var(--danger); }
  .mod-btn-danger:hover{ border-color: var(--danger); background: rgba(162, 59, 46, .06); }
  .lc-panel{ margin-top:14px; padding:14px 16px; border:1px solid var(--line); border-radius: var(--radius); background: var(--surface); font-size:14px; }
  .lc-panel p{ margin:0 0 10px; max-width:none; }
  .lc-panel .field textarea{ min-height:90px; }
  .lc-msg{ color: var(--danger); margin:10px 0 0; max-width:none; }
  .mod-result:empty{ display:none; }
  .mod-mfa-card{ max-width:440px; }
  .mod-mfa-title{ font-size:18px; margin:0 0 6px; }
  .mod-mfa-code{ max-width:200px; letter-spacing:.3em; font-size:18px; }
  .mod-mfa-msg{ margin:12px 0 0; font-size:14px; color: var(--danger); min-height:1.4em; }
  @media (max-width: 720px){
    .mod-actions .btn{ width:100%; justify-content:center; }
  }
</style>
</head>
<body>

<!-- Punto 41 (D2): ciclo de vida de un producto (solo equipo de Mobau). -->
<header class="site-header">
  <div class="wrap nav">
    <a href="index.html" class="brand">Mobau <span>Plataforma de diseño</span></a>
    <nav class="nav-links" aria-label="Principal">
      <a href="catalogo.html">Productos</a>
      <span class="nav-sep"></span>
      <span id="nav-session-slot"></span>
    </nav>
    <div class="nav-cta">
      <button class="nav-toggle" aria-label="Abrir menú"><span></span></button>
    </div>
  </div>
</header>

<main class="wrap pd-main">
  <p class="card-meta" style="margin:0 0 18px;"><a href="moderacion.html">← Volver a Moderación</a></p>

  <div id="mod-gate"><p class="card-meta">Comprobando tu acceso…</p></div>

  <div id="mod-app" hidden>
    <div id="mod-result" class="mod-box mod-result" role="status" aria-live="polite" tabindex="-1"></div>
    <p id="mod-loading" class="card-meta" hidden>Cargando el producto…</p>
    <div id="mod-message" class="pd-empty" role="alert" hidden>
      <p class="pd-empty-title" id="mod-message-title"></p>
      <p class="pd-empty-text" id="mod-message-text" hidden></p>
      <div class="mod-actions" id="mod-message-actions"></div>
    </div>
    <div id="mod-detail"></div>
  </div>
</main>

<footer class="site-footer" id="contacto">
  <div class="wrap">
    <div class="footer-bottom">
      <span>© 2026 Mobau. Piloto en preparación — uso interno.</span>
      <span>Consola de moderación</span>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="nav-session.js"></script>
<script src="moderacion-acceso.js"></script>
<script src="product-lifecycle.js"></script>
<script>
/* Ciclo de vida de un producto (41, D2). Misma puerta que Moderación
   (sesión, admin y aal2 comprobados en el servidor). Con el interruptor de
   interfaz apagado solo informa: no consulta nada de ciclo de vida.
   Encendido: lee mobau_product_lifecycle_view(id) y ofrece SOLO las
   acciones de allowed_actions, mediante mobau_product_lifecycle() y
   mobau_purge_product(). El servidor valida todo de nuevo.
   41-07: toda intervención (retirar, papelera, eliminar) pide motivo, que
   la empresa ve en Mis productos; eliminar definitivamente se puede hacer
   desde cualquier estado gestionable y la papelera no caduca. Si el
   producto ya no existe, muestra su historial (mobau_lifecycle_history). */
(() => {
  const M = MobauModeracion;
  const LC = MobauLifecycle;
  const $ = (id) => document.getElementById(id);
  const PUBLICATION = { draft: "Borrador", in_review: "En revisión", changes_requested: "Cambios solicitados", published: "Publicado", archived: "Archivado" };
  const REFERENCES = [
    ["project_lines_active", "Líneas en proyectos activos"],
    ["project_lines_archived", "Líneas en proyectos archivados"],
    ["project_lines_total", "Líneas en proyectos (total)"],
    ["rfqs", "Solicitudes de cotización"],
    ["open_proposals", "Propuestas abiertas"],
    ["closed_proposals", "Propuestas cerradas"],
    ["other_references", "Otras referencias"]
  ];

  const productId = new URLSearchParams(window.location.search).get("id");
  let gate = null;
  let loadId = 0;
  let view = null;
  let company = null;
  let locked = false; // acciones bloqueadas (empresa propia, servidor apagado…)

  function setState(state){
    $("mod-loading").hidden = state !== "loading";
    $("mod-message").hidden = state !== "message";
    $("mod-detail").hidden = state !== "detail";
  }

  function message(title, text, ...actions){
    $("mod-detail").replaceChildren();
    $("mod-message-title").textContent = title;
    $("mod-message-text").textContent = text || "";
    $("mod-message-text").hidden = !text;
    $("mod-message-actions").replaceChildren(...actions);
    setState("message");
  }

  function backLink(){
    const a = M.el("a", "btn btn-outline", "Volver a Moderación");
    a.href = "moderacion.html";
    return a;
  }
  function retryButton(){
    const b = M.el("button", "btn btn-primary", "Reintentar");
    b.type = "button";
    b.addEventListener("click", () => load());
    return b;
  }

  function clearAll(){
    loadId++;
    view = null;
    $("mod-detail").replaceChildren();
    $("mod-result").replaceChildren();
  }

  function result(text, alert){
    $("mod-result").replaceChildren(M.el("p", "", text));
    $("mod-result").classList.toggle("mod-box--alert", !!alert);
    $("mod-result").focus();
  }

  /* ---------- pintado ---------- */
  function row(label, value){
    const tr = document.createElement("tr");
    const th = M.el("td", "", label);
    const td = M.el("td", "", value === null || value === undefined || value === "" ? "—" : String(value));
    td.setAttribute("data-label", label);
    tr.append(th, td);
    return tr;
  }
  function table(rows){
    const t = M.el("table", "pd-table mod-table");
    const tbody = document.createElement("tbody");
    tbody.append(...rows);
    t.append(tbody);
    const wrap = M.el("div", "pd-table-wrap");
    wrap.append(t);
    return wrap;
  }

  function retiredBy(){
    const ev = (view.events || []).find(e => e.action === "retire");
    return ev ? (LC.ACTORS[ev.actor_kind] || ev.actor_kind) : null;
  }

  function stateSection(){
    const section = M.el("section", "mod-section");
    section.append(M.el("h2", "", "Estado"));
    const rows = [
      row("Estado de ciclo de vida", LC.stateInfo(view.lifecycle_state).label),
      row("Estado de publicación", PUBLICATION[view.publication_status] || view.publication_status),
      row("Propuesta abierta", view.has_open_proposal ? "Sí" : "No")
    ];
    if (view.retired_at){
      const by = retiredBy();
      rows.push(row("Retirado", `${M.formatDate(view.retired_at)}${by ? ` · ${by}` : ""}`));
      rows.push(row("Motivo de la retirada", view.retired_reason));
    }
    rows.push(row("Intervención de Mobau vigente", view.mobau_hold ? "Sí: la empresa no puede volver a publicarlo por su cuenta" : "No"));
    if (view.trashed_at){
      rows.push(row("En papelera desde", M.formatDate(view.trashed_at)));
      rows.push(row("Movido a la papelera por", view.trashed_by_kind === "mobau" ? "Mobau" : (view.trashed_by_kind === "distributor" ? "Empresa (voluntario)" : "—")));
      rows.push(row("Estado anterior", LC.stateInfo(view.trash_from).label));
    }
    section.append(table(rows));
    return section;
  }

  function referencesSection(){
    const refs = view.references || {};
    const section = M.el("section", "mod-section");
    section.append(M.el("h2", "", "Referencias (recuentos)"));
    const rows = REFERENCES.map(([key, label]) => row(label, refs[key] ?? "—"));
    const unknown = Array.isArray(refs.unknown_reference_tables) ? refs.unknown_reference_tables : [];
    rows.push(row("Tablas que no se pueden comprobar", unknown.length ? unknown.join(", ") : "Ninguna"));
    section.append(table(rows));
    return section;
  }

  function blocksSection(){
    const blocks = Array.isArray(view.blocks) ? view.blocks : [];
    if (!blocks.length) return null;
    const section = M.el("section", "mod-section");
    section.append(M.el("h2", "", "Bloqueos"));
    const ul = M.el("ul", "mod-blocks");
    blocks.forEach(b => ul.append(M.el("li", "", LC.BLOCKS[b] || b)));
    section.append(ul);
    return section;
  }

  function historySection(){
    const section = M.el("section", "mod-section");
    section.append(M.el("h2", "", "Historial de ciclo de vida"));
    const events = Array.isArray(view.events) ? view.events : [];
    if (!events.length){
      section.append(M.el("p", "card-meta", "Sin eventos de ciclo de vida."));
      return section;
    }
    const list = M.el("ol", "mod-history");
    events.forEach(ev => {
      const states = ev.from_state || ev.to_state ? ` (${LC.stateInfo(ev.from_state).label} → ${LC.stateInfo(ev.to_state).label})` : "";
      list.append(M.el("li", "", `${M.formatDate(ev.created_at)} · ${LC.ACTORS[ev.actor_kind] || ev.actor_kind} · ${LC.EVENTS[ev.action] || ev.action}${states}${ev.reason ? ` · ${ev.reason}` : ""}`));
    });
    section.append(list);
    return section;
  }

  /* ---------- acciones ---------- */
  function actionsSection(){
    const allowed = (Array.isArray(view.allowed_actions) ? view.allowed_actions : []).filter(a => ["retire", "trash", "restore", "purge"].includes(a));
    const section = M.el("section", "mod-section");
    section.id = "lc-actions";
    section.append(M.el("h2", "", "Acciones"));
    if (locked || !allowed.length){
      section.append(M.el("p", "card-meta", locked ? "Acciones no disponibles." : "No hay acciones disponibles para este producto en su estado actual."));
      return section;
    }
    const buttons = M.el("div", "mod-actions");
    allowed.forEach(action => {
      const b = M.el("button", action === "purge" ? "btn btn-outline mod-btn-danger" : "btn btn-outline", LC.ACTIONS[action]);
      b.type = "button";
      b.dataset.lcAction = action;
      b.addEventListener("click", () => openPanel(action, section));
      buttons.append(b);
    });
    section.append(buttons);
    return section;
  }

  function field(labelText, control, hint){
    const wrap = M.el("div", "field");
    const label = M.el("label", "", labelText);
    label.htmlFor = control.id;
    if (hint) label.append(M.el("span", "hint", ` ${hint}`));
    wrap.append(label, control);
    return wrap;
  }

  function openPanel(action, section){
    section.querySelectorAll(".lc-panel").forEach(p => p.remove());
    const panel = M.el("div", "lc-panel");
    const confirmText = action === "trash" ? LC.CONFIRM.mobau_trash : (action === "restore" ? LC.CONFIRM.mobau_restore : LC.CONFIRM[action]);
    panel.append(M.el("p", "", confirmText));

    const reason = document.createElement("textarea");
    reason.id = "lc-reason";
    const reasonRequired = action === "retire" || action === "trash" || action === "purge";
    panel.append(field("Motivo", reason, reasonRequired ? `(obligatorio, hasta ${LC.REASON_MAX} caracteres; la empresa lo verá)` : `(opcional, hasta ${LC.REASON_MAX} caracteres)`));

    let confirmInput = null;
    if (action === "purge"){
      confirmInput = document.createElement("input");
      confirmInput.id = "lc-confirm-id";
      confirmInput.autocomplete = "off";
      confirmInput.spellcheck = false;
      panel.append(field("Identificador del producto", confirmInput, `(escribe exactamente «${view.product_id}»)`));
      if (view.lifecycle_state !== "trashed") panel.append(M.el("p", "", "Eliminación definitiva directa: el producto no está en la papelera."));
    }

    const msg = M.el("p", "lc-msg");
    msg.setAttribute("role", "status");
    const ok = M.el("button", action === "purge" ? "btn btn-primary mod-btn-danger" : "btn btn-primary", `Confirmar: ${LC.ACTIONS[action].toLowerCase()}`);
    ok.type = "button";
    const cancel = M.el("button", "btn btn-outline", "Cancelar");
    cancel.type = "button";
    const buttons = M.el("div", "mod-actions");
    buttons.append(ok, cancel);
    panel.append(buttons, msg);
    cancel.addEventListener("click", () => panel.remove());

    ok.addEventListener("click", async () => {
      msg.textContent = "";
      const problem = LC.reasonError(reason.value, reasonRequired);
      if (problem){ msg.textContent = problem; reason.focus(); return; }
      if (action === "purge" && confirmInput.value !== view.product_id){
        msg.textContent = LC.TEXT.confirmMismatch;
        confirmInput.focus();
        return;
      }
      ok.disabled = true;
      cancel.disabled = true;
      const text = reason.value.trim();
      try {
        if (action === "purge") await LC.purge(view.product_id, confirmInput.value, text, view.updated_at);
        else await LC.act(view.product_id, action, text || null, view.updated_at);
      } catch (error){
        if (!(await actionFailure(error, msg))){ ok.disabled = false; cancel.disabled = false; }
        return;
      }
      LC.invalidateCatalog();
      if (action === "purge"){
        view = null;
        await showDeleted(productId, LC.DONE.purge);
        return;
      }
      await load();
      result(LC.DONE[action]);
    });
    section.append(panel);
    reason.focus();
  }

  /* true si el error ya se resolvió (recarga, bloqueo, puerta). */
  async function actionFailure(error, msg){
    const c = LC.classify(error);
    if (c.kind === "login"){ window.location.href = MobauAccess.accessUrlForCurrentPage(); return true; }
    if (c.kind === "mfa"){ if (await gate.relock(c.message)) msg.textContent = c.message; return true; }
    if (c.kind === "denied"){ gate.deny(c.message); return true; }
    if (c.kind === "not_found"){ await showDeleted(productId); return true; }
    if (c.kind === "version_conflict"){ await load(); result(c.message, true); return true; }
    if (["server_disabled", "no_permission", "ui_disabled"].includes(c.kind) || (c.kind === "blocked" && error && error.hint === "self_moderation_forbidden")){
      locked = true;
      render();
      result(c.message, true);
      return true;
    }
    msg.textContent = c.message;
    return false;
  }

  function render(){
    const st = LC.stateInfo(view.lifecycle_state);
    const nodes = [];
    nodes.push(M.el("div", "eyebrow", "Ciclo de vida del producto"));
    const title = M.el("h1", "pd-head", view.name || view.product_id);
    title.style.cssText = "font-size:28px; margin:8px 0 0; overflow-wrap:anywhere;";
    nodes.push(title);
    const meta = M.el("div", "mod-head-meta");
    meta.append(M.chip(st.label, st.kind), M.el("span", "", [company || view.distributor_id, `producto ${view.product_id}`].join(" · ")));
    nodes.push(meta);
    nodes.push(stateSection());
    const blocks = blocksSection();
    if (blocks) nodes.push(blocks);
    nodes.push(actionsSection(), referencesSection(), historySection());
    $("mod-detail").replaceChildren(...nodes);
    setState("detail");
  }

  /* ---------- producto eliminado (41-07) ----------
     El producto ya no existe: su historial sigue en la auditoría. Se lee con
     mobau_lifecycle_history(id) y se pinta como el historial de siempre. */
  async function showDeleted(id, doneTitle){
    let rows;
    try {
      rows = await LC.history(id);
    } catch (error){
      message(doneTitle || LC.TEXT.notFound, "", backLink());
      return;
    }
    if (!Array.isArray(rows) || !rows.length){
      message(doneTitle || LC.TEXT.notFound, "", backLink());
      return;
    }
    const purge = rows.find(r => r.action === "purge");
    const name = (rows.find(r => r.product_name) || {}).product_name || id;
    const distId = rows[0].distributor_id;
    const { data: d } = await supabaseClient.from("distributors").select("id, name").eq("id", distId).maybeSingle();
    const nodes = [M.el("div", "eyebrow", "Ciclo de vida del producto")];
    const title = M.el("h1", "pd-head", name);
    title.style.cssText = "font-size:28px; margin:8px 0 0; overflow-wrap:anywhere;";
    nodes.push(title);
    const meta = M.el("div", "mod-head-meta");
    meta.append(M.chip(purge ? "Eliminado definitivamente" : "No existe", "alert"), M.el("span", "", `producto ${id}`));
    nodes.push(meta);
    if (doneTitle) nodes.push(M.el("p", "", doneTitle));
    if (purge){
      nodes.push(table([
        row("Eliminado", M.formatDate(purge.created_at)),
        row("Por", purge.actor_kind === "mobau" ? "Mobau" : "La empresa"),
        row("Motivo", purge.reason),
        row("Empresa", d ? d.name : distId)
      ]));
    }
    const section = M.el("section", "mod-section");
    section.append(M.el("h2", "", "Historial de ciclo de vida"));
    const list = M.el("ol", "mod-history");
    rows.forEach(ev => {
      const states = ev.from_state || ev.to_state ? ` (${LC.stateInfo(ev.from_state).label} → ${LC.stateInfo(ev.to_state).label})` : "";
      list.append(M.el("li", "", `${M.formatDate(ev.created_at)} · ${LC.ACTORS[ev.actor_kind] || ev.actor_kind} · ${LC.EVENTS[ev.action] || ev.action}${ev.action === "purge" ? "" : states}${ev.reason ? ` · ${ev.reason}` : ""}`));
    });
    section.append(list);
    nodes.push(section, backLink());
    $("mod-detail").replaceChildren(...nodes);
    setState("detail");
  }

  /* ---------- carga ---------- */
  async function load(){
    const id = ++loadId;
    if (!LC.enabled()){
      message(LC.TEXT.unavailable, "Cuando se active, aquí podrás revisar el estado, las referencias y las acciones de cada producto.", backLink());
      return;
    }
    if (productId === null){
      message("Falta el producto que quieres consultar.", "Ábrelo desde la lista de productos de Moderación.", backLink());
      return;
    }
    if (!productId.trim() || productId.length > 200){
      message(LC.TEXT.notFound, "", backLink());
      return;
    }
    setState("loading");
    let data;
    try {
      data = await LC.view(productId);
    } catch (error){
      if (id !== loadId) return;
      const c = LC.classify(error);
      if (c.kind === "login"){ window.location.href = MobauAccess.accessUrlForCurrentPage(); return; }
      if (c.kind === "mfa"){ if (await gate.relock(c.message)) load(); return; }
      if (c.kind === "denied"){ gate.deny(c.message); return; }
      if (c.kind === "not_found"){ await showDeleted(productId); return; }
      if (["server_disabled", "no_permission", "ui_disabled"].includes(c.kind)){ message(c.message, "", retryButton(), backLink()); return; }
      message("No pudimos cargar el producto.", c.message, retryButton(), backLink());
      return;
    }
    if (id !== loadId) return;
    if (!data || data.product_id !== productId){
      message("No pudimos cargar el producto.", LC.TEXT.network, retryButton(), backLink());
      return;
    }
    view = data;
    if (!company){
      const { data: d } = await supabaseClient.from("distributors").select("id, name").eq("id", view.distributor_id).maybeSingle();
      company = d ? d.name : null;
    }
    if (id !== loadId) return;
    render();
  }

  gate = M.start({ onReady: () => load(), onLock: clearAll });
})();
</script>
</body>
</html>

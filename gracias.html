<title>Redirigiendo… — Mobau</title>
<!--
  Página retirada (35A-0). Mostraba una "confirmación" de cotización con
  la referencia, el nombre y los números que llegaran en la URL, así que
  cualquiera podía fabricar una confirmación falsa de Mobau. Las
  solicitudes reales se confirman en el propio proyecto. Se conserva el
  archivo solo para que los enlaces o marcadores antiguos no den 404:
  redirige siempre a index.html, sin leer ni mostrar ningún parámetro de
  la URL. location.replace() evita que esta página quede en el historial;
  el meta refresh cubre el caso sin JavaScript.
-->
<script>location.replace("index.html");</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<main class="wrap" style="padding: 80px 0; text-align:center;">
  <p>Redirigiendo…</p>

</main>

</body>

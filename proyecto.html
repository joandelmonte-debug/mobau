<html lang="es">

<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=seleccion.html">
<title>Redirigiendo… — Mobau</title>
<!--
  Página retirada (35A-0). Era parte del flujo antiguo de "carrito" en la
  URL (proyecto.html → rfq.html → gracias.html), que permitía simular una
  solicitud de cotización sin sesión. Se conserva el archivo solo para que
  los enlaces o marcadores antiguos no den 404: redirige siempre a
  seleccion.html, sin leer ni reenviar ningún parámetro de la URL.
  location.replace() evita que esta página quede en el historial (Atrás no
  vuelve aquí); el meta refresh cubre el caso sin JavaScript. El script va
  antes de la hoja de estilos para no esperar a que cargue.
-->
<script>location.replace("seleccion.html");</script>
<link rel="stylesheet" href="styles.css">
</head>

</main>

</body>
